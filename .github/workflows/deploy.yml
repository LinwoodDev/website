name: Deploy website

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore generated image cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: .astro/og-cache
          key: ${{ runner.os }}-og-images-${{ hashFiles('src/pages/og/**', 'src/content/blog/**', 'src/content/authors/**', 'src/content/projects/**', 'public/logos/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-og-images-
      - name: Restore incremental build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-build-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      - name: Deploy to SFTP
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{secrets.SFTP_KNOWN_HOSTS}}
        run: |
          echo "$SFTP_KEY" > sftp_key
          chmod 600 sftp_key
          echo "$SFTP_KNOWN_HOSTS" > known_hosts
          chmod 600 known_hosts
          rsync -avz --delete -e "ssh -i sftp_key -o UserKnownHostsFile=known_hosts" dist/ $SFTP_USERNAME@$SFTP_HOST:/var/www/www.linwood
